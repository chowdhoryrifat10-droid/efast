<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>eFast Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root{--bg:#0d0f1a;--sidebar:#111320;--card:#161928;--card2:#1c2035;--border:#242840;--accent:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--accent4:#f7971e;--text:#e8eaf6;--muted:#7b80a0;--danger:#ff4757;--success:#2ed573;--warning:#ffa502;--info:#1e90ff;--sidebar-w:240px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden;}
  #login-gate{position:fixed;inset:0;z-index:999999;background:radial-gradient(circle at 50% 25%,#1a1f3a 0%,#0d0f1a 65%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  #login-gate.hidden{display:none;}
  .gate-box{position:relative;width:100%;max-width:400px;background:rgba(22,25,40,.88);border:1px solid #242840;border-radius:22px;padding:40px 30px 32px;backdrop-filter:blur(24px);box-shadow:0 30px 90px rgba(0,0,0,.55);text-align:center;}
  .gate-logo{width:70px;height:70px;margin:0 auto 20px;background:linear-gradient(135deg,#6c63ff,#ff6584);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .gate-box h2{color:#e8eaf6;font-size:23px;font-weight:800;margin-bottom:6px;}
  .gate-box .gate-sub{color:#7b80a0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;margin-bottom:26px;}
  .gate-field{text-align:left;margin-bottom:18px;}
  .gate-field label{display:block;font-size:11px;color:#7b80a0;font-weight:700;text-transform:uppercase;margin-bottom:7px;padding-left:4px;}
  .gate-input-wrap{position:relative;}
  .gate-input-wrap>i.lead-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#4b5568;font-size:14px;pointer-events:none;}
  .gate-input-wrap input{width:100%;padding:14px 44px 14px 42px;background:rgba(13,15,26,.7);border:1px solid #242840;border-radius:13px;color:#e8eaf6;font-size:14px;outline:none;}
  .gate-input-wrap input:focus{border-color:#6c63ff;box-shadow:0 0 0 4px rgba(108,99,255,.15);}
  .gate-toggle-pass{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;color:#4b5568;font-size:14px;padding:6px 8px;}
  .gate-error{color:#ff4757;font-size:12.5px;font-weight:600;min-height:18px;margin:4px 0 12px;text-align:left;padding-left:4px;}
  #gate-btn{width:100%;padding:15px;background:linear-gradient(135deg,#6c63ff,#5850e6);border:none;border-radius:13px;color:#fff;font-size:14px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;gap:9px;}
  #gate-btn:disabled{opacity:.7;cursor:not-allowed;}
  .gate-hint{margin-top:18px;padding:10px 14px;background:rgba(108,99,255,.08);border:1px dashed rgba(108,99,255,.3);border-radius:10px;font-size:11.5px;color:#7b80a0;}
  #sidebar{width:var(--sidebar-w);background:var(--sidebar);border-right:1px solid var(--border);display:none;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;}
  .sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .sidebar-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .sidebar-logo h1{font-size:16px;font-weight:700;}
  .sidebar-logo span{font-size:11px;color:var(--muted);}
  .sidebar-nav{flex:1;overflow-y:auto;padding:10px 0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13.5px;color:var(--muted);border-left:3px solid transparent;}
  .nav-item:hover{background:rgba(108,99,255,.08);color:var(--text);}
  .nav-item.active{background:rgba(108,99,255,.12);color:var(--accent);border-left-color:var(--accent);}
  .nav-item i{width:18px;text-align:center;font-size:14px;}
  .nav-item.logout{color:var(--danger);}
  .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:20px;text-align:center;}
  .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);}
  #main{margin-left:var(--sidebar-w);flex:1;display:none;flex-direction:column;min-height:100vh;}
  #topbar{height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-left h2{font-size:16px;font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .notif-btn{position:relative;cursor:pointer;color:var(--muted);}
  .notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--accent2);border-radius:50%;border:2px solid var(--sidebar);}
  .admin-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:13px;cursor:pointer;position:relative;}
  .admin-avatar{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .admin-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:170px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:200;}
  .admin-dropdown.open{display:block;}
  .admin-dropdown .dd-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--text);}
  .admin-dropdown .dd-item:hover{background:var(--card2);}
  .admin-dropdown .dd-item.danger{color:var(--danger);}
  #content{padding:24px;flex:1;}
  .section{display:none;}
  .section.active{display:block;}
  .section-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .section-title i{color:var(--accent);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;}
  .stat-card .stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .stat-card .stat-val{font-size:26px;font-weight:700;}
  .stat-card .stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:4px;}
  .stat-card.c1 .stat-icon{background:rgba(108,99,255,.15);color:var(--accent);}
  .stat-card.c2 .stat-icon{background:rgba(255,101,132,.15);color:var(--accent2);}
  .stat-card.c3 .stat-icon{background:rgba(67,233,123,.15);color:var(--accent3);}
  .stat-card.c4 .stat-icon{background:rgba(247,151,30,.15);color:var(--accent4);}
  .stat-card .stat-trend{font-size:12px;color:var(--success);}
  .panel-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
  .panel-card h3{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .panel-card h3 i{color:var(--accent);font-size:14px;}
  .master-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
  .master-block{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .master-block-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--card2);}
  .master-block-header h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .master-block-header h4 i{color:var(--accent);font-size:13px;}
  .master-block-body{padding:18px;}
  .save-bar{background:var(--card2);border-top:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
  .save-bar span{font-size:12px;color:var(--muted);}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{background:var(--card2);color:var(--muted);font-weight:600;padding:10px 14px;text-align:left;font-size:12px;text-transform:uppercase;}
  td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge.success{background:rgba(46,213,115,.12);color:var(--success);}
  .badge.danger{background:rgba(255,71,87,.12);color:var(--danger);}
  .badge.warning{background:rgba(255,165,2,.12);color:var(--warning);}
  .badge.info{background:rgba(30,144,255,.12);color:var(--info);}
  .badge.accent{background:rgba(108,99,255,.12);color:var(--accent);}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-success{background:var(--success);color:#0d0f1a;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-sm{padding:5px 11px;font-size:12px;}
  .btn-xs{padding:3px 8px;font-size:11px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;}
  .form-control{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13.5px;outline:none;font-family:inherit;}
  .form-control:focus{border-color:var(--accent);}
  select.form-control option{background:var(--card2);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
  .toggle input{opacity:0;width:0;height:0;}
  .toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--border);transition:.3s;border-radius:24px;}
  .toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%;}
  .toggle input:checked + .toggle-slider{background:var(--accent);}
  .toggle input:checked + .toggle-slider:before{transform:translateX(20px);}
  .search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .search-input{flex:1;min-width:200px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:13.5px;outline:none;}
  .user-row{display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
  #toast{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13.5px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .toast-item.success{border-left:3px solid var(--success);}
  .toast-item.error{border-left:3px solid var(--danger);}
  .toast-item.info{border-left:3px solid var(--accent);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
  .modal-close{cursor:pointer;color:var(--muted);font-size:18px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .mini-bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;padding:0 4px;}
  .bar{flex:1;border-radius:4px 4px 0 0;background:var(--accent);opacity:.7;}
  .loader{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);gap:12px;font-size:14px;}
  .empty-state{text-align:center;padding:40px 24px;color:var(--muted);}
  .empty-state i{font-size:40px;margin-bottom:14px;opacity:.3;display:block;}
  .empty-state p{font-size:14px;}
  .live-dot{width:8px;height:8px;background:var(--success);border-radius:50%;display:inline-block;}
  .tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;}
  .tab{padding:10px 18px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .status-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
  .dep-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
  .dep-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .dep-info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
  .dep-info-item .di-label{font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:3px;}
  .dep-info-item .di-val{font-size:13px;font-weight:600;color:var(--text);}
  .dep-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pay-method-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .pm-left{display:flex;align-items:center;gap:12px;}
  .pm-icon-big{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .flex{display:flex;}.items-center{align-items:center;}.gap-8{gap:8px;}.justify-between{justify-content:space-between;}.mb-16{margin-bottom:16px;}
  .fc-red{color:var(--danger);}.fc-green{color:var(--success);}.fc-yellow{color:var(--warning);}.text-muted{color:var(--muted);}.text-sm{font-size:12px;}
  .gig-admin-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;}
  .gig-admin-icon{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent3);overflow:hidden;}
  .gig-admin-info h4{font-size:14px;font-weight:700;margin-bottom:4px;}
  .gig-admin-info p{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .gig-admin-price{font-size:16px;font-weight:800;color:var(--accent3);}
  .custom-card-row{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .popup-image-upload{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:var(--card2);}
  .popup-image-upload:hover{border-color:var(--accent);}
  .popup-image-upload i{font-size:28px;color:var(--accent);margin-bottom:8px;display:block;}
  .popup-preview{margin-top:12px;position:relative;}
  .popup-preview img{width:100%;max-height:200px;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
  .popup-preview .remove-btn{position:absolute;top:8px;right:8px;}
  .menu-toggle{display:none;cursor:pointer;font-size:20px;color:var(--muted);}
  @media(max-width:768px){
    #sidebar{transform:translateX(-100%);}
    #sidebar.open{transform:translateX(0);}
    #main{margin-left:0;}
    .master-grid,.row2{grid-template-columns:1fr;}
    #content{padding:16px;}
    .menu-toggle{display:block;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div id="login-gate">
  <div class="gate-box">
    <div class="gate-logo">⚡</div>
    <h2>Admin Login</h2>
    <p class="gate-sub">Authorized Access Only</p>
    <div class="gate-field">
      <label>Email</label>
      <div class="gate-input-wrap">
        <input type="email" id="gate-email" placeholder="admin@efast.com" autocomplete="username"/>
        <i class="fa-solid fa-envelope lead-icon"></i>
      </div>
    </div>
    <div class="gate-field">
      <label>Password</label>
      <div class="gate-input-wrap">
        <input type="password" id="gate-pass" placeholder="Enter password" autocomplete="current-password"/>
        <i class="fa-solid fa-lock lead-icon"></i>
        <button type="button" class="gate-toggle-pass" onclick="toggleGatePassword()"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>
    <p id="gate-error" class="gate-error"></p>
    <button id="gate-btn" onclick="handleGateLogin()"><i class="fa-solid fa-right-to-bracket"></i><span>Login</span></button>
    <div class="gate-hint"><i class="fa-solid fa-circle-info"></i> Firebase-এ তৈরি অ্যাডমিন অ্যাকাউন্ট দিয়ে লগইন করুন।</div>
  </div>
</div>

<nav id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">⚡</div><div><h1>eFast Admin</h1><span>Master Controller</span></div></div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-footer">
    <div style="font-size:12px;color:var(--muted);">Firebase: efast-25f96</div>
    <div style="font-size:12px;color:var(--success);display:flex;align-items:center;gap:6px;margin-top:4px;"><span class="live-dot"></span> <span id="conn-status">Connecting...</span></div>
  </div>
</nav>

<div id="main">
  <header id="topbar">
    <div class="topbar-left">
      <span class="menu-toggle" onclick="toggleSidebar()"><i class="fa fa-bars"></i></span>
      <h2 id="topbarTitle">Dashboard</h2>
    </div>
    <div class="topbar-right">
      <div class="notif-btn" onclick="navigate('notifications')"><i class="fa fa-bell" style="font-size:18px;"></i><span class="notif-dot"></span></div>
      <div class="admin-chip" onclick="toggleAdminDropdown(event)">
        <div class="admin-avatar" id="admin-avatar-el">A</div>
        <span id="admin-name-el">Admin</span>
        <i class="fa fa-chevron-down" style="font-size:10px;color:var(--muted);"></i>
        <div class="admin-dropdown" id="adminDropdown">
          <div class="dd-item" onclick="navigate('master');closeAdminDropdown();"><i class="fa-solid fa-gear"></i> Settings</div>
          <div class="dd-item" onclick="navigate('admins');closeAdminDropdown();"><i class="fa-solid fa-user-shield"></i> Admin List</div>
          <div class="dd-item danger" onclick="doLogout();"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
        </div>
      </div>
    </div>
  </header>
  <div id="content"></div>
</div>

<div id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <h3><span id="modalTitle">Modal</span><span class="modal-close" onclick="closeModal()"><i class="fa fa-times"></i></span></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, update, remove, push, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    messagingSenderId: "741534475360",

// ═══ LOGIN ═══
const gateErrEl = document.getElementById('gate-error');
const gateBtn = document.getElementById('gate-btn');
window.toggleGatePassword = function () {
  const inp = document.getElementById('gate-pass');
  const eye = document.querySelector('.gate-toggle-pass i');
  if (inp.type === 'password') { inp.type = 'text'; eye.className = 'fa-solid fa-eye-slash'; }
  else { inp.type = 'password'; eye.className = 'fa-solid fa-eye'; }
};
function resetGateBtn() {
  gateBtn.disabled = false;
  gateBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Login</span>';
}
function authErrorMessage(code) {
  const map = {
    'auth/invalid-email':'❌ Invalid email format.',
    'auth/user-not-found':'❌ No account found.',
    'auth/wrong-password':'❌ Incorrect password.',
    'auth/invalid-credential':'❌ Invalid email or password.',
    'auth/invalid-login-credentials':'❌ Invalid email or password.',
    'auth/too-many-requests':'⚠️ Too many attempts.',
    'auth/network-request-failed':'⚠️ Network error.',
    'auth/user-disabled':'🚫 Account disabled.',
    'auth/operation-not-allowed':'⚠️ Email/Password sign-in not enabled.'
  };
  return map[code] || '❌ Login failed.';
}
window.handleGateLogin = async function () {
  const email = document.getElementById('gate-email').value.trim();
  const pass = document.getElementById('gate-pass').value;
  gateErrEl.textContent = '';
  if (!email || !pass) { gateErrEl.textContent = '⚠️ Fill in both fields.'; return; }
  gateBtn.disabled = true;
  gateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Logging in...</span>';
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (err) {
    gateErrEl.textContent = authErrorMessage(err.code);
    resetGateBtn();
    document.getElementById('gate-pass').value = '';
  }
};
document.getElementById('gate-email').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('gate-pass').focus(); });
document.getElementById('gate-pass').addEventListener('keypress', e => { if (e.key === 'Enter') handleGateLogin(); });

let uiReady = false;
onAuthStateChanged(auth, (user) => {
  if (!user) {
    document.getElementById('login-gate').classList.remove('hidden');
    document.getElementById('sidebar').style.display = 'none';
    document.getElementById('main').style.display = 'none';
    resetGateBtn();
    return;
  }
  const name = user.email ? user.email.split('@')[0] : 'Admin';
  document.getElementById('admin-name-el').textContent = name;
  document.getElementById('admin-avatar-el').textContent = (name[0] || 'A').toUpperCase();
  document.getElementById('admin-avatar-el').title = user.email || '';
  document.getElementById('login-gate').classList.add('hidden');
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('main').style.display = 'flex';
  if (!uiReady) {
    uiReady = true;
    initLiveBadges();
    buildSidebar();
    buildSections();
    bindGlobalHandlers();
  }
  navigate('dashboard');
  toast('👋 Welcome, ' + name + '!', 'success');
});

// ═══ BADGES ═══
function initLiveBadges() {
  onValue(ref(db,'depositRequests'), snap => {
    const count = Object.values(snap.val()||{}).filter(d=>d.status==='pending').length;
    const b = document.getElementById('deposits-badge');
    if(b){ b.textContent = count>0?count:''; b.style.display = count>0?'inline':'none'; }
  }, ()=>{});
  onValue(ref(db,'freelanceProposals'), ()=>updateFreelanceBadge(), ()=>{});
  onValue(ref(db,'freelanceSubmissions'), ()=>updateFreelanceBadge(), ()=>{});
  onValue(ref(db,'freelanceProjects'), ()=>updateFreelanceBadge(), ()=>{});
  onValue(ref(db,'jobPosts'), ()=>updateTasksBadge(), ()=>{});
  onValue(ref(db,'proofSubmissions'), ()=>updateTasksBadge(), ()=>{});
}
function updateFreelanceBadge(){
  Promise.all([
    get(ref(db,'freelanceProposals')).catch(()=>({val:()=>null})),
    get(ref(db,'freelanceSubmissions')).catch(()=>({val:()=>null})),
    get(ref(db,'freelanceProjects')).catch(()=>({val:()=>null}))
  ]).then(([a,b,c])=>{
    const count =
      Object.values(a.val()||{}).filter(p=>p.status==='pending').length +
      Object.values(b.val()||{}).filter(s=>s.status==='pending').length +
      Object.values(c.val()||{}).filter(p=>p.postedByUid && p.status==='pending').length;
    const badge = document.getElementById('freelance-badge');
    if(badge){ badge.textContent = count>0?count:''; badge.style.display = count>0?'inline':'none'; }
  }).catch(()=>{});
}
function updateTasksBadge(){
  get(ref(db,'jobPosts')).then(s=>{
    const jobs = Object.values(s.val()||{}).filter(p=>p.status==='pending').length;
    get(ref(db,'proofSubmissions')).then(s2=>{
      const proofs = Object.values(s2.val()||{}).filter(p=>(p.status||'pending')==='pending').length;
      const total = jobs + proofs;
      const badge = document.getElementById('tasks-badge');
      if(badge){ badge.textContent = total>0?total:''; badge.style.display = total>0?'inline':'none'; }
    }).catch(()=>{});
  }).catch(()=>{});
}

function buildSections() {
  const contentDiv = document.getElementById('content');
  contentDiv.innerHTML = '';
  Object.keys(SECTIONS).forEach(id => {
    const sec = document.createElement('div');
    sec.className = 'section'+(id==='dashboard'?' active':'');
    sec.id = 'section-'+id;
    sec.innerHTML = SECTIONS[id]();
    contentDiv.appendChild(sec);
  });
}

window.navigate = function(id) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const sec = document.getElementById('section-'+id);
  if(sec) sec.classList.add('active');
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  const item = NAV.find(n=>n.id===id);
  document.getElementById('topbarTitle').textContent = item ? item.label : id;
  document.getElementById('sidebar').classList.remove('open');
  closeAdminDropdown();
  if(id==='dashboard') loadDashboard();
  else if(id==='deposits') loadDeposits();
  else if(id==='paymentsetup') loadPaymentSetup();
  else if(id==='master') loadMasterSettings();
  else if(id==='users') loadUsers();
  else if(id==='withdraw') loadWithdraws();
  else if(id==='tasks') loadTasks();
  else if(id==='freelance') loadFreelance();
  else if(id==='gigs') loadGigs();
  else if(id==='marketplace') loadMarketplace();
  else if(id==='ranking') loadRanking();
  else if(id==='admins') loadAdmins();
};
window.switchTab = function(el, cid) {
  const tabBar = el.closest('.tab-bar');
  const section = el.closest('.section');
  if (tabBar) { tabBar.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); }
  if (section) section.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  const tc = document.getElementById(cid);
  if (tc) tc.classList.add('active');
  if (cid === 'tv-live-tab' || cid === 'tv-pending-tab' || cid === 'tv-proofs-tab') loadTasks();
};
window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('open');
window.toggleAdminDropdown = (e) => { e.stopPropagation(); document.getElementById('adminDropdown').classList.toggle('open'); };
window.closeAdminDropdown = () => document.getElementById('adminDropdown')?.classList.remove('open');

window.toast = function(msg, type='info') {
  const t = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item ' + type;
  const icons = {success:'fa-check-circle',error:'fa-times-circle',info:'fa-circle-info'};
  el.innerHTML = '<i class="fa-solid ' + icons[type] + '" style="color:' + (type==='success'?'var(--success)':type==='error'?'var(--danger)':'var(--accent)') + '"></i> ' + msg;
  t.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
};
window.openModal = function(title, bodyHTML, actions=[]) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  const actEl = document.getElementById('modalActions'); actEl.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (a.cls||'btn-primary');
    btn.innerHTML = a.label;
    btn.onclick = a.fn;
    actEl.appendChild(btn);
  });
  document.getElementById('modalOverlay').classList.add('open');
};
window.closeModal = () => document.getElementById('modalOverlay').classList.remove('open');

function bindGlobalHandlers() {

// ═══ DASHBOARD ═══
function loadDashboard() {
  const stats = [0,1,2,3,4,5,6,7].map(i=>document.getElementById('stat-'+i));
  onValue(ref(db,'users'), snap=>{
    const arr = Object.values(snap.val()||{});
    const today = new Date().toDateString();
    if(stats[0]) stats[0].textContent = arr.length;
    if(stats[1]) stats[1].textContent = arr.filter(u=>u.joinedAt&&new Date(u.joinedAt).toDateString()===today).length;
    if(stats[2]) stats[2].textContent = arr.filter(u=>!u.banned).length;
    if(stats[3]) stats[3].textContent = '৳'+arr.reduce((s,u)=>s+(u.balance||0),0).toLocaleString();
  }, ()=>{ [0,1,2,3].forEach(i=>{if(stats[i]) stats[i].textContent='0';}); }, {onlyOnce:true});
  onValue(ref(db,'withdrawals'), snap=>{
    const arr = Object.values(snap.val()||{});
    if(stats[4]) stats[4].textContent = arr.filter(w=>w.status==='pending'||w.status==='Pending').length;
    if(stats[5]) stats[5].textContent = '৳'+arr.filter(w=>w.status==='Approved'||w.status==='approved').reduce((s,w)=>s+(w.amount||0),0).toLocaleString();
  }, ()=>{ [4,5].forEach(i=>{if(stats[i]) stats[i].textContent='0';}); }, {onlyOnce:true});
  onValue(ref(db,'depositRequests'), snap=>{
    const arr = Object.values(snap.val()||{});
    if(stats[6]) stats[6].textContent = arr.filter(d=>d.status==='pending').length;
    if(stats[7]) stats[7].textContent = '৳'+arr.filter(d=>d.status==='approved').reduce((s,d)=>s+(d.amount||0),0).toLocaleString();
  }, ()=>{ [6,7].forEach(i=>{if(stats[i]) stats[i].textContent='0';}); }, {onlyOnce:true});

  const liveEl = document.getElementById('liveStats');
  if(liveEl) {
    Promise.all([get(ref(db,'appSettings')).catch(()=>null), get(ref(db,'settings')).catch(()=>null)]).then(([aSnap,sSnap])=>{
      const a = (aSnap && aSnap.val())||{}; const s = (sSnap && sSnap.val())||{};
      liveEl.innerHTML = '<div class="status-row"><span class="label"><span class="live-dot"></span> App</span><span class="badge '+(s.maintenance?'danger':'success')+'">'+(s.maintenance?'Maintenance':'Live')+'</span></div>'+
        '<div class="status-row"><span class="label">Withdraw</span><span class="badge '+(a.withdrawOpen!==false?'success':'danger')+'">'+(a.withdrawOpen!==false?'Open':'Closed')+'</span></div>'+
        '<div class="status-row"><span class="label">Daily Bonus</span><span class="badge '+(a.dailyBonusEnabled?'success':'warning')+'">'+(a.dailyBonusEnabled?'On':'Off')+'</span></div>'+
        '<div class="status-row"><span class="label">Referral</span><span class="badge '+(a.referralEnabled?'success':'warning')+'">'+(a.referralEnabled?'On':'Off')+'</span></div>';
    }).catch(()=>{ liveEl.innerHTML = '<div class="empty-state"><p>Failed to load</p></div>'; });
  }

  const chartEl = document.getElementById('growthChart');
  if(chartEl) {
    onValue(ref(db,'users'), snap=>{
      const data = snap.val()||{};
      const days = {};
      for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days[d.toDateString()]=0; }
      Object.values(data).forEach(u=>{ if(u.joinedAt){ const k=new Date(u.joinedAt).toDateString(); if(days[k]!==undefined) days[k]++; }});
      const vals = Object.values(days);
      const max = Math.max(...vals,1);
      chartEl.innerHTML = vals.map(v=>'<div class="bar" style="height:'+Math.max((v/max)*100,6)+'%;background:linear-gradient(180deg,var(--accent),var(--accent2));" title="'+v+'"></div>').join('');
      const labelsEl = document.getElementById('chartLabels');
      if(labelsEl) labelsEl.innerHTML = Object.keys(days).map(d=>'<span>'+new Date(d).toLocaleDateString('en',{weekday:'short'})+'</span>').join('');
    }, ()=>{}, {onlyOnce:true});
  }
}

// ═══ DEPOSITS ═══
let allDeposits = [];
window.loadDeposits = function() {
  onValue(ref(db,'depositRequests'), snap => {
    allDeposits = [];
    Object.entries(snap.val()||{}).forEach(([key,d])=>allDeposits.push(Object.assign({_key:key},d)));
    allDeposits.sort((a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
    renderDeposits(); updateDepStats();
  }, ()=>{}, {onlyOnce:true});
};
function updateDepStats() {
  const p = document.getElementById('dep-stat-pending');
  const a = document.getElementById('dep-stat-approved');
  const t = document.getElementById('dep-stat-total');
  if(p) p.textContent = allDeposits.filter(d=>d.status==='pending').length;
  if(a) a.textContent = allDeposits.filter(d=>d.status==='approved').length;
  if(t) t.textContent = '৳'+allDeposits.filter(d=>d.status==='approved').reduce((s,d)=>s+(d.amount||0),0).toLocaleString();
}
function renderDeposits() {
  const pending = allDeposits.filter(d=>d.status==='pending');
  const approved = allDeposits.filter(d=>d.status==='approved');
  const rejected = allDeposits.filter(d=>d.status==='rejected');
  const pEl = document.getElementById('depPendingList');
  const aEl = document.getElementById('depApprovedList');
  const rEl = document.getElementById('depRejectedList');
  if(pEl) pEl.innerHTML = pending.length ? pending.map(d=>depositCard(d,'pending')).join('') : '<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No pending deposits</p></div>';
  if(aEl) aEl.innerHTML = approved.length ? approved.map(d=>depositCard(d,'approved')).join('') : '<div class="empty-state"><p>No approved</p></div>';
  if(rEl) rEl.innerHTML = rejected.length ? rejected.map(d=>depositCard(d,'rejected')).join('') : '<div class="empty-state"><p>No rejected</p></div>';
}
function depositCard(d, type) {
  const methodIcon = d.method==='bkash'?'🔴':d.method==='nagad'?'🟠':'💳';
  const statusBadge = type==='pending'?'<span class="badge warning">⏳ Pending</span>':type==='approved'?'<span class="badge success">✅ Approved</span>':'<span class="badge danger">❌ Rejected</span>';
  const date = d.submittedAt ? new Date(d.submittedAt).toLocaleString('en-BD') : (d.date||'—');
  return '<div class="dep-card"><div class="dep-card-head"><div><div style="font-size:15px;font-weight:700;margin-bottom:4px">'+methodIcon+' '+(d.method||'').toUpperCase()+' Deposit</div><div style="font-size:12px;color:var(--muted)">'+date+'</div></div><div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--accent3)">৳'+(d.amount||0).toLocaleString()+'</div>'+statusBadge+'</div></div>'+
  '<div class="dep-info-grid"><div class="dep-info-item"><div class="di-label">TXN ID</div><div class="di-val" style="color:var(--accent);cursor:pointer;" onclick="copyText(\''+(d.txnId||'')+'\')">'+(d.txnId||'—')+'</div></div><div class="dep-info-item"><div class="di-label">Sender Number</div><div class="di-val">'+(d.senderNum||'—')+'</div></div><div class="dep-info-item"><div class="di-label">To Number</div><div class="di-val">'+(d.toNumber||'—')+'</div></div><div class="dep-info-item"><div class="di-label">User ID</div><div class="di-val" style="font-size:11px;color:var(--muted)">'+(d.userId||'—')+'</div></div></div>'+
  (type==='pending' ? '<div class="dep-actions"><button class="btn btn-success btn-sm" onclick="approveDeposit(\''+d._key+'\',\''+(d.userId||'')+'\','+(d.amount||0)+')"><i class="fa-solid fa-check"></i> Approve ৳'+(d.amount||0)+'</button><button class="btn btn-danger btn-sm" onclick="rejectDeposit(\''+d._key+'\',\''+(d.userId||'')+'\')"><i class="fa-solid fa-times"></i> Reject</button></div>' : type==='approved' ? '<div style="background:rgba(46,213,115,.07);border:1px solid rgba(46,213,115,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--success)">✅ Approved — ৳'+d.amount+' added.</div>' : '<div style="background:rgba(255,71,87,.07);border:1px solid rgba(255,71,87,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--danger)">❌ Rejected — '+(d.rejectReason||'')+'</div>')+
  '</div>';
}
window.approveDeposit = async function(key, userId, amount) {
  if(!userId) { toast('User ID missing','error'); return; }
  if(!confirm('৳'+amount+' approve?')) return;
  try {
    const userSnap = await get(ref(db, 'users/'+userId));
    const u = userSnap.val() || {};
    const newBal = (u.balance||0) + amount;
    await update(ref(db, 'users/'+userId), { balance: newBal });
    await update(ref(db, 'depositRequests/'+key), { status: 'approved', approvedAt: Date.now(), newBalance: newBal });
    await push(ref(db, 'transactions/'+userId), { type: 'Deposit', description: 'Deposit approved +৳'+amount, amount: amount, date: new Date().toISOString() });
    await push(ref(db, 'notifications/'+userId), { title:'✅ Deposit Approved', message:'Your deposit of ৳'+amount+' has been approved.', type:'deposit_approved', sentAt:Date.now(), read:false });
    toast('✅ ৳'+amount+' approved!', 'success');
    loadDeposits();
  } catch(e) { toast('Error: '+e.message, 'error'); }
};
window.rejectDeposit = function(key, userId) {
  openModal('❌ Reject Deposit', '<div class="form-group"><label>Reason</label><select class="form-control" id="reject-reason"><option value="TXN ID ভুল">TXN ID ভুল</option><option value="Amount মিলছে না">Amount মিলছে না</option><option value="নম্বর ভুল">নম্বর ভুল</option><option value="Duplicate">Duplicate</option><option value="অন্য কারণ">অন্য কারণ</option></select></div><div class="form-group"><label>Note</label><input class="form-control" id="reject-note"/></div>', [{ label: 'Reject', cls: 'btn-danger', fn: async () => {
    const reason = document.getElementById('reject-reason').value;
    const note = document.getElementById('reject-note').value;
    await update(ref(db, 'depositRequests/'+key), { status:'rejected', rejectReason: reason + (note?' — '+note:''), rejectedAt: Date.now() });
    if(userId){
      await push(ref(db, 'transactions/'+userId), { type:'Deposit Rejected', description:'Rejected: '+reason, amount:0, date:new Date().toISOString() });
      await push(ref(db, 'notifications/'+userId), { title:'❌ Deposit Rejected', message:'Reason: '+reason, type:'deposit_rejected', sentAt:Date.now(), read:false });
    }
    toast('Rejected','error'); closeModal(); loadDeposits();
  }}]);
};

// ═══ PAYMENT SETUP ═══
window.loadPaymentSetup = function() {
  get(ref(db,'paymentMethods')).then(snap => {
    const pm = snap.val()||{};
    const setV = (id,v)=>{ const e=document.getElementById(id); if(!e) return; if(e.type==='checkbox') e.checked=!!v; else e.value=v||''; };
    const b = pm.bkash||{}; setV('pm-bkash-num', b.number); setV('pm-bkash-name', b.name); setV('pm-bkash-active', b.active);
    const n = pm.nagad||{}; setV('pm-nagad-num', n.number); setV('pm-nagad-name', n.name); setV('pm-nagad-active', n.active);
    renderCurrentPayMethods(pm);
  }).catch(e=>toast('Payment: '+e.message,'error'));
};
function renderCurrentPayMethods(pm) {
  const el = document.getElementById('currentPayMethods'); if(!el) return;
  const methods = Object.entries(pm);

let customCards = [];
function loadCustomCards(cardsObj) {
  customCards = [];
  if (cardsObj) {
    Object.entries(cardsObj).forEach(([id, c]) => customCards.push(Object.assign({ _id: id },c)));
    customCards.sort((a,b) => (a.order||0)-(b.order||0));
  }
  renderCustomCards();
}
function renderCustomCards() {
  const container = document.getElementById('customCardsContainer');
  if (!container) return;
  if (!customCards.length) { container.innerHTML = '<p style="color:var(--muted);font-size:12px;padding:8px;text-align:center;">No custom cards yet.</p>'; return; }
  container.innerHTML = customCards.map((c, i) => '<div class="custom-card-row" data-card-idx="'+i+'"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><strong style="font-size:12px;color:var(--accent);">Card #'+(i+1)+'</strong><button class="btn btn-xs btn-danger" onclick="removeCustomCard('+i+')"><i class="fa-solid fa-trash"></i> Remove</button></div><div class="row2"><div class="form-group"><label>Title</label><input class="form-control cc-title" value="'+(c.title||'').replace(/"/g,'&quot;')+'" placeholder="SURVEY"/></div><div class="form-group"><label>Subtitle</label><input class="form-control cc-sub" value="'+(c.subtitle||'').replace(/"/g,'&quot;')+'" placeholder="Subtitle"/></div></div><div class="row2"><div class="form-group"><label>Link</label><input class="form-control cc-link" value="'+(c.link||'').replace(/"/g,'&quot;')+'" placeholder="link.html"/></div><div class="form-group"><label>Icon</label><input class="form-control cc-icon" value="'+(c.icon||'').replace(/"/g,'&quot;')+'" placeholder="📊"/></div></div><div class="row2"><div class="form-group"><label>Background</label><input class="form-control cc-color" value="'+(c.color||'').replace(/"/g,'&quot;')+'" placeholder="linear-gradient(...)"/></div><div class="form-group"><label>Icon Color</label><input class="form-control cc-iconcolor" value="'+(c.iconColor||'').replace(/"/g,'&quot;')+'" placeholder="#fff"/></div></div></div>').join('');

let allUsers=[];

  const tbody=document.getElementById('usersTbody'); if(!tbody) return;
  tbody.innerHTML='<tr><td colspan="6"><div class="loading-overlay"><span class="loader"></span></div></td></tr>';
  onValue(ref(db,'users'), snap=>{
    allUsers=[]; Object.entries(snap.val()||{}).forEach(([uid,u])=>allUsers.push(Object.assign({uid},u)));
    renderUsers(allUsers);
  }, ()=>{ tbody.innerHTML='<tr><td colspan="6"><div class="empty-state fc-red"><p>Load failed</p></div></td></tr>'; }, {onlyOnce:true});
};

  const tbody=document.getElementById('usersTbody'); if(!tbody) return;

let allWithdraws=[];
window.loadWithdraws=function(){
  onValue(ref(db,'withdrawals'), snap=>{
    allWithdraws=[];Object.entries(snap.val()||{}).forEach(([id,w])=>allWithdraws.push(Object.assign({id},w)));
    renderWithdraws();
  }, ()=>{}, {onlyOnce:true});

function renderWithdraws(){
  const pending = allWithdraws.filter(w=>w.status==='Pending'||w.status==='pending'||!w.status);
  const approved = allWithdraws.filter(w=>w.status==='Approved'||w.status==='approved');
  const rejected = allWithdraws.filter(w=>w.status==='Rejected'||w.status==='rejected');
  const wdT=document.getElementById('wdTbody');
  if(wdT) wdT.innerHTML=pending.length?pending.map(w=>'<tr><td>'+((w.uid||'').slice(0,10)||'?')+'</td><td><strong class="fc-yellow">৳'+(w.amount||0)+'</strong></td><td><span class="badge info">'+(w.method||'N/A')+'</span></td><td class="text-muted text-sm">'+(w.phone||w.account||'—')+'</td><td class="text-muted text-sm">'+(w.date?new Date(w.date).toLocaleString('en-BD'):'-')+'</td><td><div class="flex gap-8"><button class="btn btn-xs btn-success" onclick="approveWithdraw(\''+w.id+'\')"><i class="fa-solid fa-check"></i></button><button class="btn btn-xs btn-danger" onclick="rejectWithdraw(\''+w.id+'\',\''+w.uid+'\','+(w.amount||0)+')"><i class="fa-solid fa-times"></i></button></div></td></tr>').join(''):'<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No pending</p></div></td></tr>';
  const apT=document.getElementById('wdApprovedTbody');
  if(apT) apT.innerHTML=approved.length?approved.map(w=>'<tr><td>'+(w.name||((w.uid||'').slice(0,10))||'?')+'</td><td class="fc-green">৳'+(w.amount||0)+'</td><td>'+(w.method||'?')+'</td><td class="text-muted text-sm">'+(w.date?new Date(w.date).toLocaleString('en-BD'):'-')+'</td></tr>').join(''):'<tr><td colspan="4"><div class="empty-state"><p>None</p></div></td></tr>';
  const rjT=document.getElementById('wdRejectedTbody');
  if(rjT) rjT.innerHTML=rejected.length?rejected.map(w=>'<tr><td>'+(w.name||((w.uid||'').slice(0,10))||'?')+'</td><td class="fc-red">৳'+(w.amount||0)+'</td><td>'+(w.method||'?')+'</td><td class="text-muted text-sm">'+(w.date?new Date(w.date).toLocaleString('en-BD'):'-')+'</td></tr>').join(''):'<tr><td colspan="4"><div class="empty-state"><p>None</p></div></td></tr>';

      liveTbody.innerHTML = live.length ? live.map(t => {
        const pct = t.limit ? Math.round(((t.done||0)/t.limit)*100) : 0;
        return '<tr><td><strong>'+(t.title||'Task')+'</strong><div class="text-muted text-sm">'+(t.category||'')+(t.userId==='admin'?' • Admin':' • User')+'</div></td><td class="fc-yellow">৳'+(t.reward||0)+'</td><td class="text-muted text-sm">'+(t.done||0)+'/'+(t.limit||0)+' ('+pct+'%)</td><td><div class="flex gap-8"><button class="btn btn-xs btn-ghost" onclick="closeJobPost(\''+t.id+'\')"><i class="fa-solid fa-lock"></i></button><button class="btn btn-xs btn-danger" onclick="deleteTask(\''+t.id+'\')"><i class="fa-solid fa-trash"></i></button></div></td></tr>';
      }).join('') : '<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-list-check"></i><p>No live jobs</p></div></td></tr>';

    }
  }).catch(()=>{});
  get(ref(db, 'proofSubmissions')).then((snap) => {

/* ═══════════════════════════════════════════════════════
   ✅ Image Upload — Save base64 directly to Firebase
   (No external API, works on HTTP/HTTPS)
   ═══════════════════════════════════════════════════════ */
function compressImageToDataUrl(file, maxWidth, quality) {
    maxWidth = maxWidth || 900;
    quality = quality || 0.7;
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Image load failed'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('File read failed'));
        reader.readAsDataURL(file);
    });
}

window.uploadPopupImage = async function(input) {
    const file = input.files[0];
    if (!file) return;

    if (file.size > 8 * 1024 * 1024) {
        toast('Image must be under 8MB', 'error');
        input.value = '';
        return;
    }
    if (!file.type.startsWith('image/')) {
        toast('Please select an image file', 'error');
        input.value = '';
        return;
    }

    toast('Compressing & saving...', 'info');

    try {
        const dataUrl = await compressImageToDataUrl(file, 900, 0.7);
        const sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
        console.log('Compressed size:', sizeKB, 'KB');

        if (sizeKB > 800) {
            toast('❌ Image too large (~' + sizeKB + 'KB). Try smaller.', 'error');
            input.value = '';
            return;
        }

        document.getElementById('m-popupImage').value = dataUrl;
        document.getElementById('popupImagePreviewImg').src = dataUrl;
        document.getElementById('popupImagePreview').style.display = 'block';

        const urlField = document.getElementById('m-popupImageUrl');
        if (urlField) urlField.value = '';

        toast('✅ Image ready! (~' + sizeKB + 'KB) Click Save.', 'success');

    } catch (err) {
        console.error('Upload error:', err);
        toast('❌ Failed: ' + err.message, 'error');
    } finally {
        input.value = '';
    }
};

  if (!box) return;
  if (url && url.trim() !== '') { img.src = url; box.style.display='block'; if (urlInput) urlInput.value = url; }
  else { box.style.display='none'; if (urlInput) urlInput.value = ''; }
}

// ═══ LOGOUT ═══
window.doLogout=function(){
  if(!confirm('Logout?')) return;
  signOut(auth).catch(()=>location.reload());
};
</script>
